name: Sync fork

on:
  schedule:
    - cron: '23 */6 * * *' # every 6 hours
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork with upstream (kingsword09/zcode-cli)
        run: gh repo sync ${{ github.repository }} -b main
        env:
          GH_TOKEN: ${{ github.token }}
